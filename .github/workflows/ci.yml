name: Build and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  JAVA_VERSION: "20"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require changelog fragments for runtime changes
        if: github.event_name == 'pull_request'
        env:
          CHANGELOG_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/verify-changelog-fragments.sh
      - name: Verify entry-point architecture
        run: ./scripts/verify-entrypoint-architecture.sh
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Configure package authentication
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings><servers><server><id>github-oz-tools</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server></servers></settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Install PluginAPI locally
        run: mvn -B install:install-file -Dfile=libs/PluginAPI.jar -DgroupId=net.risingworld -DartifactId=PluginAPI -Dversion=0.9.3 -Dpackaging=jar
      - run: mvn -B package
      - run: ls dist/*.zip

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require curated changelog and release notes
        run: |
          ! find changelog/unreleased -type f -name '*.md' -print -quit | grep -q .
          test -s "release-notes/${GITHUB_REF_NAME#v}.md"
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Configure package authentication
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings><servers><server><id>github-oz-tools</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server></servers></settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Install PluginAPI locally
        run: mvn -B install:install-file -Dfile=libs/PluginAPI.jar -DgroupId=net.risingworld -DartifactId=PluginAPI -Dversion=0.9.3 -Dpackaging=jar
      - name: Verify the release version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version: //p' src/resources/plugin.yml)"
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n 1)"
          test -s "release-notes/${GITHUB_REF_NAME#v}.md"
      - run: mvn -B -DskipTests package
      - name: Prepare release notes
        run: cp "release-notes/${GITHUB_REF_NAME#v}.md" release-notes/current.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes/current.md
          files: dist/*.zip
